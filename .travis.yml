language: cpp

sudo: required
cache: ccache

if: tag IS blank

jobs:
  include:
    - os: linux
      dist: noble
      compiler: clang
      env: TARGET=linux64 USE_QT=qt6 DIST=noble
      
    - os: linux
      dist: noble
      compiler: gcc
      env: TARGET=linux64 USE_QT=qt6 DIST=noble
      
    - os: linux
      dist: jammy
      env: TARGET=linux64 USE_GTK=gtk3
      
    - os: linux
      dist: jammy
      env: TARGET=linux64 USE_GTK=gtk2
      
    - os: linux
      dist: jammy
      env: TARGET=linux64 USE_DAEMON=jsonrpc
      
    - os: osx
      osx_image: xcode12.3
      env: TARGET=macos64 macOS=11.1
      
    - os: linux
      dist: focal
      env: TARGET=windows32
      
    - os: linux
      dist: focal
      env: TARGET=windows64

install:
  - ./tests/travis-ci/install-build-depends.sh

script:
  - ./tests/travis-ci/build-and-test.sh
